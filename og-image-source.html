<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face{
    font-family:'Geist';
    src:url('fonts/Geist-Variable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;
  }
  @font-face{
    font-family:'Geist Mono';
    src:url('fonts/GeistMono-Variable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    background: #0C0D0A;
    color: #F2F4EC;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
    letter-spacing: -0.01em;
  }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(110px); pointer-events: none;
    width: 640px; height: 640px; top: -300px; left: -180px;
    background: radial-gradient(circle, #C4FF47 0%, transparent 65%); opacity: 0.16;
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 52px; position: relative; }
  .brand svg { width: 50px; height: 50px; }
  .brand .name { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
  .brand .flow { color: #C4FF47; }
  h1 {
    font-size: 84px; font-weight: 600; line-height: 1.04; letter-spacing: -0.035em;
    max-width: 980px; position: relative; margin-bottom: 40px;
  }
  h1 .em { color: #C4FF47; }
  .sub {
    font-size: 26px; color: rgba(242,244,236,0.64); line-height: 1.45;
    max-width: 900px; position: relative;
  }
  .stat {
    position: absolute; bottom: 56px; left: 90px; right: 90px;
    display: flex; align-items: baseline; gap: 14px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 18px; color: rgba(242,244,236,0.42);
    border-top: 1px solid rgba(242,244,236,0.12); padding-top: 26px;
  }
  .stat b { color: #C4FF47; font-weight: 500; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <g fill="#C4FF47">
        <path d="M4 6L20 6L22 11L6 11Z"/>
        <path d="M7 13L23 13L25 18L9 18Z"/>
        <path d="M10 20L26 20L28 25L12 25Z"/>
      </g>
    </svg>
    <span class="name">Renner<span class="flow">Flow</span></span>
  </div>
  <h1>The work you repeat, <span class="em">running itself.</span></h1>
  <div class="sub">Custom AI workflows, built into the tools your team already uses.</div>
  <div class="stat"><b>10</b> analyst hours saved every week at Radicle Growth</div>
</body>
</html>
