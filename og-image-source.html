<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #140D18;
    color: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
    letter-spacing: -0.01em;
  }
  .glow-a, .glow-b {
    position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none;
  }
  .glow-a { width: 560px; height: 560px; top: -260px; left: -160px;
    background: radial-gradient(circle, #C4FF47 0%, transparent 70%); opacity: 0.28; }
  .glow-b { width: 520px; height: 520px; bottom: -260px; right: -140px;
    background: radial-gradient(circle, #9B7BF7 0%, transparent 70%); opacity: 0.3; }
  .grid {
    position: absolute; inset: 0; opacity: 0.3;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 48px; position: relative; }
  .brand svg { width: 52px; height: 52px; }
  .brand .name { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .brand .flow { color: #C4FF47; }
  h1 {
    font-size: 76px; font-weight: 700; line-height: 1.02; letter-spacing: -0.035em;
    max-width: 980px; position: relative; margin-bottom: 36px;
  }
  h1 .em { color: #C4FF47; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; }
  .sub {
    font-size: 27px; color: rgba(255,255,255,0.68); line-height: 1.45;
    max-width: 860px; position: relative;
  }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <g fill="#C4FF47">
        <path d="M4 6L20 6L22 11L6 11Z"/>
        <path d="M7 13L23 13L25 18L9 18Z"/>
        <path d="M10 20L26 20L28 25L12 25Z"/>
      </g>
    </svg>
    <span class="name">Renner<span class="flow">Flow</span></span>
  </div>
  <h1>Deal sourcing, built around <span class="em">your fund.</span></h1>
  <div class="sub">Custom AI pipelines that source, enrich, and CRM-load investment opportunities.</div>
</body>
</html>
